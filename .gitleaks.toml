title = "watch-ai"

[extend]
useDefault = true

# One allowlist table: the gitleaks the CI action installs (8.24) only reads [allowlist], not [[allowlists]].
# Test data is synthetic by rule and carries the SYNTHETIC marker on the same line. The public OAuth client
# id of OpenAI's Codex CLI is not a secret. Model hashes and pinned action SHAs are hashes.
[allowlist]
description = "synthetic test values, a public client id, hashes"
regexTarget = "line"
regexes = ['''SYNTHETIC''', '''app_EMoamEEZ73f0CkXaXp7hrann''']
paths = ['''core/brain-ondevice/src/main/assets/models\.json''', '''\.github/workflows/.*\.yml''', '''\.github/requirements-ci\.txt''', '''gradle/verification-metadata\.xml''']
